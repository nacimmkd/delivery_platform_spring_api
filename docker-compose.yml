services:
  postgres:
    image: postgres:16
    container_name: ecolis-db
    env_file:
      - backend/.env
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ecolis-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build: backend
    container_name: ecolis-backend
    depends_on:
      - postgres
      - redis
    env_file:
      - backend/.env
    environment:
      - FRONTEND_BASE_URL=http://localhost
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      args:
        API_URL: http://localhost:8080
        STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
    container_name: ecolis-frontend
    depends_on:
      - backend
    env_file:
      - frontend/.env
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  postgres_data: